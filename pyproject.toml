[project]
name = "ratica"
version = "0.1.2"
description = "Translate long technical PDF books entirely on your own computer, to PDF and EPUB."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.20",
    "psutil>=7.2.2",
    "pymupdf>=1.28.2",
    "pymupdf-fonts>=1.0.5",
    "pyside6-essentials>=6.11.2",
    "requests>=2.34.2",
]

[project.scripts]
ratica = "ratica.cli:main"

[project.gui-scripts]
ratica-gui = "ratica.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ratica"]

[dependency-groups]
build = [
    "pillow>=11",
    "pyinstaller>=6.10",
]
dev = [
    "gguf>=0.19.0",
    "psutil>=7.2.2",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "requests>=2.34.2",
    "sacrebleu>=2.6.0",
]
